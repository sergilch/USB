start" class="dev">XE</text><text x="337" y="166" text-anchor="start" class="sz">12×50/0.35 33</text><polyline points="330,125 330,125" fill="none"/><circle cx="200" cy="155" r="3.5" fill="var(--bg, #fff)" stroke="currentColor" stroke-width="1.6"/><text x="192" y="159" text-anchor="end" class="pin">e33b</text><polyline points="204,155 285,155" fill="none"/><polyline points="330,185 330,220" fill="none"/><circle cx="330" cy="220" r="2.6" fill="currentColor" stroke="none"/><text x="340" y="214" text-anchor="start" class="sz">cs (n-wells of XSP/XSN/XSD)</text><polyline points="170,220 530,220" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><polyline points="170,220 170,227.0 177,230.0 163,236.0 177,242.0 163,248.0 177,254.0 163,260.0 170,263.0 170,270" fill="none"/><text x="184" y="243.0" text-anchor="start" class="dev">RSP</text><text x="184" y="256.0" text-anchor="start" class="sz">10 Ω</text><polyline points="155,285 155,315" fill="none"/><polyline points="149,288 149,312" fill="none"/><circle cx="145" cy="300" r="3.5" fill="var(--bg, #fff)" stroke="currentColor"/><polyline points="125,300 141.5,300" fill="none"/><polyline points="155,289 170,289 170,270" fill="none"/><polyline points="155,311 170,311 170,330" fill="none"/><polygon points="160,285.5 160,292.5 154,289" fill="currentColor" stroke="none"/><text x="177" y="298" text-anchor="start" class="dev">XSP</text><text x="177" y="311" text-anchor="start" class="sz">12×50/0.35 33</text><polyline points="125,300 110,300" fill="none"/><text x="106" y="304" text-anchor="end" class="dev">gp</text><polyline points="170,330 170,350" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><circle cx="170" cy="354" r="3.5" fill="var(--bg, #fff)" stroke="var(--accent, #0f7c80)" stroke-width="1.6"/><text x="170" y="371" text-anchor="middle" class="pin">DP</text><polyline points="350,220 350,227.0 357,230.0 343,236.0 357,242.0 343,248.0 357,254.0 343,260.0 350,263.0 350,270" fill="none"/><text x="364" y="243.0" text-anchor="start" class="dev">RSN</text><text x="364" y="256.0" text-anchor="start" class="sz">10 Ω</text><polyline points="335,285 335,315" fill="none"/><polyline points="329,288 329,312" fill="none"/><circle cx="325" cy="300" r="3.5" fill="var(--bg, #fff)" stroke="currentColor"/><polyline points="305,300 321.5,300" fill="none"/><polyline points="335,289 350,289 350,270" fill="none"/><polyline points="335,311 350,311 350,330" fill="none"/><polygon points="340,285.5 340,292.5 334,289" fill="currentColor" stroke="none"/><text x="357" y="298" text-anchor="start" class="dev">XSN</text><text x="357" y="311" text-anchor="start" class="sz">12×50/0.35 33</text><polyline points="305,300 290,300" fill="none"/><text x="286" y="304" text-anchor="end" class="dev">gn</text><polyline points="350,330 350,350" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><circle cx="350" cy="354" r="3.5" fill="var(--bg, #fff)" stroke="var(--accent, #0f7c80)" stroke-width="1.6"/><text x="350" y="371" text-anchor="middle" class="pin">DM</text><polyline points="530,220 530,227.0 537,230.0 523,236.0 537,242.0 523,248.0 537,254.0 523,260.0 530,263.0 530,270" fill="none"/><text x="544" y="243.0" text-anchor="start" class="dev">RSD</text><text x="544" y="256.0" text-anchor="start" class="sz">10 Ω</text><polyline points="515,285 515,315" fill="none"/><polyline points="509,288 509,312" fill="none"/><circle cx="505" cy="300" r="3.5" fill="var(--bg, #fff)" stroke="currentColor"/><polyline points="485,300 501.5,300" fill="none"/><polyline points="515,289 530,289 530,270" fill="none"/><polyline points="515,311 530,311 530,330" fill="none"/><polygon points="520,285.5 520,292.5 514,289" fill="currentColor" stroke="none"/><text x="537" y="298" text-anchor="start" class="dev">XSD</text><text x="537" y="311" text-anchor="start" class="sz">12×50/0.35 33</text><polyline points="485,300 470,300" fill="none"/><text x="466" y="304" text-anchor="end" class="dev">gd</text><polyline points="530,330 530,350" fill="none"/><polyline points="530,350 530,362.0 537,365.0 523,371.0 537,377.0 523,383.0 537,389.0 523,395.0 530,398.0 530,410" fill="none"/><text x="544" y="378.0" text-anchor="start" class="dev">RDQ</text><text x="544" y="391.0" text-anchor="start" class="sz">22.5 Ω</text><polyline points="520,410 540,410" fill="none"/><polyline points="524,414 536,414" fill="none"/><polyline points="528,418 532,418" fill="none"/><text x="350" y="470" text-anchor="middle" class="sz">RSP / RSN / RSD: degeneration, I·R = 0.18 V widens the transfer window</text><text x="350" y="435" text-anchor="middle" class="ar">XSP on: rdy &amp; (p | !n) · XSN on: rdy &amp; (n | !p) · XSD on: !rdy</text><text x="350" y="452" text-anchor="middle" class="sz">P = N opens XSP and XSN together: 8.9 mA each (model: half / half)</text><polyline points="240,30 240,48.5" fill="none"/><polyline points="228,48.5 252,48.5" fill="none"/><polyline points="228,56.5 252,56.5" fill="none"/><polyline points="240,56.5 240,75" fill="none"/><text x="222" y="50.5" text-anchor="end" class="dev">CK</text><text x="222" y="63.5" text-anchor="end" class="sz">1 pF</text><polyline points="240,75 240,75" fill="none"/><circle cx="240" cy="75" r="2.6" fill="currentColor" stroke="none"/><polyline points="240,30 240,20 120,20" fill="none"/><circle cx="116" cy="20" r="3.5" fill="var(--bg, #fff)" stroke="currentColor" stroke-width="1.6"/><text x="108" y="24" text-anchor="end" class="pin">eb2 (= TX_EN, 3.3 V)</text><text x="-30" y="490" text-anchor="start" class="sz">CK: eb2 steps +3.3 V on vbp when XS's drain falls out of triode (−1.6 V): cancels about 3 pC</text><text x="820" y="40" text-anchor="middle" class="lb">parking while TX_EN = 0 (e33 = 0)</text><polyline points="705,70 725,70" fill="none"/><text x="715" y="65" text-anchor="middle" class="rail">VDD33</text><polyline points="700,95 700,125" fill="none"/><polyline points="694,98 694,122" fill="none"/><circle cx="690" cy="110" r="3.5" fill="var(--bg, #fff)" stroke="currentColor"/><polyline points="670,110 686.5,110" fill="none"/><polyline points="700,99 715,99 715,80" fill="none"/><polyline points="700,121 715,121 715,140" fill="none"/><polygon points="705,95.5 705,102.5 699,99" fill="currentColor" stroke="none"/><text x="722" y="108" text-anchor="start" class="dev">XKC</text><text x="722" y="121" text-anchor="start" class="sz">10/0.35 33</text><polyline points="715,70 715,80" fill="none"/><polyline points="670,110 660,110" fill="none"/><text x="656" y="114" text-anchor="end" class="sz">e33</text><polyline points="715,140 715,160" fill="none"/><text x="715" y="175" text-anchor="middle" class="dev">cs → VDD33</text><rect x="680" y="200" width="280" height="60" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="820.0" y="230.0" text-anchor="middle" class="bx">XKP, XKN, XKD (8/0.35 33)</text><text x="820.0" y="245.0" text-anchor="middle" class="sz">gp, gn, gd → VDD33</text><rect x="680" y="290" width="280" height="75" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="820.0" y="327.5" text-anchor="middle" class="bx">XTP, XTN, XTD: nch33 + pch33 TG</text><text x="820.0" y="342.5" text-anchor="middle" class="sz">12/0.35 33, e33 / e33b</text><text x="820" y="352" text-anchor="middle" class="sz">cut the 1.8 V pre-drivers off</text><text x="820" y="395" text-anchor="middle" class="sz">With FS / LS on the line (DP at 3.3 V)</text><text x="820" y="410" text-anchor="middle" class="sz">a switch gate at 1.8 V would conduct and</text><text x="820" y="425" text-anchor="middle" class="sz">the n-wells on cs would forward-bias:</text><text x="820" y="440" text-anchor="middle" class="sz">parked, every junction on DP / DM is</text><text x="820" y="455" text-anchor="middle" class="sz">reverse biased.</text></svg>