<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1040 520" role="img" aria-label="HS output branch (VDD33): XS (356 units of 10/1, 17.8 mA, gate vbp) through the enable switch XE into cs, steered by XSP to DP, XSN to DM or XSD to the 22.5 Ohm dump; CK cancels the charge vbp loses when XE closes; while TX is off XKC and XKP/XKN/XKD park cs and the switch gates at VDD33" class="sch" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" font-family="IBM Plex Mono, ui-monospace, monospace"><style>
