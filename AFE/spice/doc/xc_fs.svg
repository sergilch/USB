 x="570" y="222" text-anchor="start" class="dev">o</text><polyline points="640,230 662.0,230 665.0,237 671.0,223 677.0,237 683.0,223 689.0,237 695.0,223 698.0,230 720,230" fill="none"/><text x="680.0" y="218" text-anchor="middle" class="dev">RS</text><text x="680.0" y="252" text-anchor="middle" class="sz">26 Ω</text><polyline points="720,230 760,230" fill="none" stroke="var(--accent, #0f7c80)" stroke-width="2"/><circle cx="764" cy="230" r="3.5" fill="var(--bg, #fff)" stroke="var(--accent, #0f7c80)" stroke-width="1.6"/><text x="772" y="234" text-anchor="start" class="pin">DP / DM</text><polyline points="515,110 300,110" fill="none"/><circle cx="490" cy="110" r="2.6" fill="currentColor" stroke="none"/><text x="508" y="104" text-anchor="middle" class="dev">gp</text><polyline points="515,300 300,300" fill="none"/><circle cx="490" cy="300" r="2.6" fill="currentColor" stroke="none"/><text x="508" y="318" text-anchor="middle" class="dev">gn</text><polyline points="490,110 490,145" fill="none"/><polyline points="490,145 490,166.0" fill="none"/><polyline points="478,166.0 502,166.0" fill="none"/><polyline points="478,174.0 502,174.0" fill="none"/><polyline points="490,174.0 490,195" fill="none"/><text x="472" y="168.0" text-anchor="end" class="dev">CMP</text><text x="472" y="181.0" text-anchor="end" class="sz">1 pF</text><polyline points="490,195 490,230" fill="none"/><polyline points="490,230 560,230" fill="none"/><circle cx="490" cy="230" r="2.6" fill="currentColor" stroke="none"/><polyline points="490,230 490,245" fill="none"/><polyline points="490,245 490,261.0" fill="none"/><polyline points="478,261.0 502,261.0" fill="none"/><polyline points="478,269.0 502,269.0" fill="none"/><polyline points="490,269.0 490,285" fill="none"/><text x="472" y="263.0" text-anchor="end" class="dev">CMN</text><text x="472" y="276.0" text-anchor="end" class="sz">1 pF</text><polyline points="490,285 490,300" fill="none"/><polyline points="410,300 410,330" fill="none"/><circle cx="410" cy="300" r="2.6" fill="currentColor" stroke="none"/><polyline points="410,330 410,346.0" fill="none"/><polyline points="398,346.0 422,346.0" fill="none"/><polyline points="398,354.0 422,354.0" fill="none"/><polyline points="410,354.0 410,370" fill="none"/><text x="392" y="348.0" text-anchor="end" class="dev">CGB</text><text x="392" y="361.0" text-anchor="end" class="sz">0.5 pF</text><polyline points="400,370 420,370" fill="none"/><polyline points="404,374 416,374" fill="none"/><polyline points="408,378 412,378" fill="none"/><text x="680" y="275" text-anchor="middle" class="ar">output slope I / CM (+ Cgd)</text><polyline points="235,40 255,40" fill="none"/><text x="245" y="35" text-anchor="middle" class="rail">VDD33</text><polyline points="230,55 230,85" fill="none"/><polyline points="224,58 224,82" fill="none"/><circle cx="220" cy="70" r="3.5" fill="var(--bg, #fff)" stroke="currentColor"/><polyline points="200,70 216.5,70" fill="none"/><polyline points="230,59 245,59 245,40" fill="none"/><polyline points="230,81 245,81 245,100" fill="none"/><polygon points="235,55.5 235,62.5 229,59" fill="currentColor" stroke="none"/><text x="252" y="68" text-anchor="start" class="dev">XPO</text><text x="252" y="81" text-anchor="start" class="sz">20/0.35 33</text><polyline points="200,70 185,70" fill="none"/><text x="181" y="74" text-anchor="end" class="dev">u</text><polyline points="245,100 245,110" fill="none"/><circle cx="245" cy="110" r="2.6" fill="currentColor" stroke="none"/><polyline points="245,110 300,110" fill="none"/><rect x="20" y="130" width="200" height="60" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="120.0" y="160.0" text-anchor="middle" class="bx">XPN (gate u) · XPLS</text><text x="120.0" y="175.0" text-anchor="middle" class="sz">LS sink: nch33 5/2 at nb</text><text x="120" y="205" text-anchor="middle" class="sz">XPFS (gate fs) + XPFI 7×5/1: +350 µA for FS</text><polyline points="220,160 245,160 245,110" fill="none"/><text x="120" y="118" text-anchor="middle" class="ar">gp falls (pull-up on) when u = 1</text><rect x="20" y="270" width="200" height="60" rx="3" fill="var(--panel, none)" stroke="currentColor"/><text x="120.0" y="300.0" text-anchor="middle" class="bx">XNP (gate db) · XNLS</text><text x="120.0" y="315.0" text-anchor="middle" class="sz">LS source: pch33 10/2 at vbp</text><text x="120" y="345" text-anchor="middle" class="sz">XNFS (gate fsb) + XNFI 7×10/1: +350 µA</text><text x="120" y="258" text-anchor="middle" class="ar">gn rises (pull-down on) when d = 1</text><polyline points="220,300 300,300" fill="none"/><polyline points="230,395 230,425" fill="none"/><polyline points="224,398 224,422" fill="none"/><polyline points="200,410 224,410" fill="none"/><polyline points="230,399 245,399 245,380" fill="none"/><polyline points="230,421 245,421 245,440" fill="none"/><polygon points="239,417.5 239,424.5 245,421" fill="currentColor" stroke="none"/><text x="252" y="408" text-anchor="start" class="dev">XNO</text><text x="252" y="421" text-anchor="start" class="sz">10/0.35 33</text><polyline points="245,380 245,300" fill="none"/><circle cx="245" cy="300" r="2.6" fill="currentColor" stroke="none"/><polyline points="200,410 185,410" fill="none"/><text x="181" y="414" text-anchor="end" class="dev">db</text><polyline points="245,440 245,450" fill="none"/><polyline points="235,450 255,450" fill="none"/><polyline points="239,454 251,454" fill="none"/><polyline points="243,458 247,458" fill="none"/><text x="850" y="350" text-anchor="middle" class="lb">control (FS logic XF0..XF14, VDD18)</text><text x="740" y="372" text-anchor="start" class="sz">OE = 0 or !pok</text><text x="865" y="372" text-anchor="start" class="sz">u = d = 0: off</text><text x="740" y="389" text-anchor="start" class="sz">SE0 = 1</text><text x="865" y="389" text-anchor="start" class="sz">both wires low</text><text x="740" y="406" text-anchor="start" class="sz">DAT xor LS = 1</text><text x="865" y="406" text-anchor="start" class="sz">DP high</text><text x="740" y="423" text-anchor="start" class="sz">DAT xor LS = 0</text><text x="865" y="423" text-anchor="start" class="sz">DM high</text><text x="740" y="440" text-anchor="start" class="sz">LS = 1</text><text x="865" y="440" text-anchor="start" class="sz">FS sources off</text><text x="850" y="470" text-anchor="middle" class="sz">u, d, ls → ls_up → VDD33</text></svg>