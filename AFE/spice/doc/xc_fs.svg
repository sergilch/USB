<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1040 500" role="img" aria-label="FS / LS driver, one wire (VDD33): push-pull XMP / XMN with RS 26 Ohm; Miller capacitors CMP / CMN from the drain o to each gate set the slew: a gate turns on through a current source (LS: a 5/2 mirror of nb; FS adds 7 x 50 uA) and off at once through XPO / XNO, so the two devices never conduct together" class="sch" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" font-family="IBM Plex Mono, ui-monospace, monospace"><style>
